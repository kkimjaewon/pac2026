# Team world (franka_world.sdf) obstacles, identical to fr3_team_scene.yaml.
# HA006B has no published SRDF; self pairs are the URDF parent-child links with collision geometry,
# plus base_link/motor_s: motor_s is fixed on lower_frame_link, so only j1 moves it relative to
# base_link. Swept j1 -3..3 rad at 0.0005 rad (official collision meshes): 0 contacts, min 1.42 mm.
# Their AABBs always overlap, so checking this pair cost ~30 of 38 us per collision sample.
version: 1
frame: map
obstacle_margin_m: 0.005
joint_step_rad: 0.002
max_path_steps: 128
boxes:
- name: table
  source_model: table
  center:
  - 0.65
  - 0
  - 0.35
  size:
  - 0.7
  - 0.8
  - 0.7
  quaternion_xyzw:
  - 0
  - 0
  - 0
  - 1
- name: plate_motion_envelope
  source_model: steel_plate
  center:
  - 0.5
  - 0
  - 0.705
  size:
  - 0.4
  - 0.3
  - 0.01
  quaternion_xyzw:
  - 0
  - 0
  - 0
  - 1
  motion_xy_radius_m: 0.05
  allow_dynamic_model: true
- name: camera
  source_model: rgbd_camera
  center:
  - 0.5
  - 0
  - 1.5
  size:
  - 0.03
  - 0.1
  - 0.03
  quaternion_xyzw:
  - 0
  - 0.7071080798594735
  - 0
  - 0.7071054825112363
  geometry_source: visual
- name: floor
  source_model: ground_plane
  center:
  - 0
  - 0
  - -0.01
  size:
  - 10
  - 10
  - 0.02
  quaternion_xyzw:
  - 0
  - 0
  - 0
  - 1
  geometry_type: plane
disabled_self_pairs:
- - base_link
  - lower_frame_link
- - lower_frame_link
  - upper_frame_link
- - upper_frame_link
  - arm_link
- - arm_link
  - wrist_body_link
- - wrist_body_link
  - wrist_holder_link
- - wrist_holder_link
  - flange_link
- - lower_frame_link
  - motor_s
- - arm_link
  - motor_v_r2
- - base_link
  - motor_s
disabled_environment_pairs:
- - base_link
  - floor
