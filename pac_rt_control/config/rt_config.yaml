# rt_control_node 파라미터 (B 계층, 시나리오 1)
#
# 실행: ros2 launch rt_control rt_control.launch.py            (이 파일을 읽음)
#       ros2 launch rt_control rt_control.launch.py config:=/다른/경로.yaml
# 코드 안 기본값과 다른 것: fifo·cpu·mlock (코드 기본은 모두 꺼짐, 여기서는 시연 PC 기준으로 켬),
#                           planned_position (코드 기본 [0.5, 0.0, 0.2])
# 표시: [확정] 계약·팀에서 정한 값, [제안] B가 정한 임시값, [미정] 아직 정하지 않음
#       "공통 값(scenario_config) 후보" = 계약 v0.3에서 A·B가 같은 값을 쓰기로 한 것
#
# 주의: ROS 파라미터는 형이 엄격함. 실수는 꼭 소수점을 붙일 것 (1 이 아니라 1.0)
rt_control_node:
  ros__parameters:
    # ---------------- 실시간 ----------------
    fifo: true            # SCHED_FIFO 실시간 스케줄링. 일반 스케줄링이면 최대 지터가 수 ms (docs/measurements.md)
    prio: 80              # 1ms 루프 FIFO 우선순위 (1~99). 커널 irq 스레드(50)보다 높고 bridge_prio보다 높게
    cpu: 6                # 1ms 루프 전용 CPU. 물리 코어 3, 짝꿍 CPU 7은 비워 둠 (-1 = 고정 안 함)
    mlock: true           # mlockall. 실행 중 페이지 폴트(수십 us 지연)를 막음
    bridge_prio: 70       # 발행 스레드 FIFO 우선순위 (fifo가 true일 때만). 루프(prio)보다 낮게.
                          # 일반 스케줄링이면 늦게 깨서 seq를 초당 0~7개 건너뜀 (2026-10-06 측정)
    bridge_cpu: -1        # 발행 스레드 CPU. -1 = 특정 코어에 고정 안 함 (그래도 루프 코어와 짝꿍은 피함)

    # ---------------- A 수신·gate ----------------
    ttl_ns: 200000000     # A 명령 유효기한 [ns] = 200ms. [A와 확정] 나이(age) 방식, 조정 예정. 공통 값(scenario_config) 후보
    confidence_min: 0.5   # 이 신뢰도 이상만 통과. A도 0.5 미만이면 FAIL로 보냄 [A와 확정]. 공통 값(scenario_config) 후보
    expected_layout_version: 1  # A 메시지 레이아웃 번호. 다르면 FAULT
    expected_command_type: 0    # 0 = position (시나리오 1). 다른 종류는 gate가 막음
    planned_position: [0.5, 0.0, 0.71]  # 계획 위치 (map [m]). 지금은 가짜 A base_target에 맞춤.
                                        # 팀 scenario_config.yaml이 정해지면 그 값으로 맞출 것. 공통 값(scenario_config) 후보
    accept_radius: 0.05   # 계획 위치에서 이 거리 이하만 통과 [m] = ±5cm [확정]. 공통 값(scenario_config) 후보

    # ---------------- blend ----------------
    blend_mode: "single"  # 새 명령을 gate 통과 시 한 번 반영 [확정, 계약 미확정 #4]. median3·칼만은 나중에 검토
    target_offset: [0.0, 0.0, 0.0]  # 철판 표면 위 작업 높이. 임시값, 팀 합의(C의 IK 확인) 후 확정.
                                    # [x, y, z] m, map 기준. gate 통과한 AI 위치에 더해 blend 목표로 씀.
                                    # gate 검사·시작 위치·HOLD 목표에는 안 더함. 0이면 예전과 같음
    blend_deadband: 0.0005  # 목표 불감대 [m] = 0.5mm. [제안] 새 AI 명령을 반영하면 목표가 움직일 거리가
                            # 이보다 작으면 목표를 바꾸지 않음 (도착 뒤 목표가 미세하게 계속 흔들리지 않게). 0 = 끔

    # ---------------- limiter·시작 ----------------
    v_max: 0.10           # 출력 속도 한계 [m/s]. [미정] Franka 안전 범위 안에서 조정
    a_max: 0.20           # 출력 가속도 한계 [m/s²]. C 한도 0.2 m/s²에 맞춤 (2026-10-08, 예전 0.50). DECEL_STOP 감속에도 이 값을 씀
    j_max: 1.0            # 출력 저크 한계 [m/s³]. [제안] 가속도가 1ms에 j_max×1ms 이하로만 바뀜 (S자 출발·정지).
                          # 정지에서 출발할 때 가속도가 0 -> a_max로 한 번에 뛰면 C가 관절 가속도 초과로 거부 (full_test_05).
                          # 0 = 끔 (예전처럼 가속도가 계단처럼 바뀜). DECEL_STOP 감속에도 이 값을 씀
                          # 목표에 속도 0으로 도착하면 목표가 바뀔 때까지 출력 위치를 비트 단위로 그대로 유지 (설정 없음)

    # ---------------- 도착 판정 (C와 합의: 2mm · 0.3초) ----------------
    arrive_tol: 0.002     # |blend 목표 - 측정 TCP(HalState)|가 이 안이면 "도착 범위" [m] = 2mm [C와 합의]
    arrive_hold_s: 0.3    # 도착 범위에 이만큼 이상 머물면 "도착" [s] [C와 합의]. rt.csv arrived·tcp_error_m 열

    # ---------------- 재개 기준 (C 답 대기라 파라미터로 둠) ----------------
    resume_from_last_cmd: true  # DECEL_STOP·FAULT -> RUN 재개 때 마지막 발행 HalCommand 위치와 측정 TCP 차이가
                                # resume_match_tol 안이면 마지막 발행 위치에서 limiter 재시작 (C가 받던 명령이 이어짐).
                                # 밖이면 측정 위치에서 시작 + 경고. false면 예전처럼 항상 측정 위치 [제안, C 답 대기]
    resume_match_tol: 0.002     # 위 비교의 허용 오차 [m] = 2mm [제안, C 답 대기]
                                # DECEL_STOP에서 재개할 때는 위 두 값을 쓰지 않고, 측정 TCP가 있으면
                                # limiter와 blend 목표를 측정 TCP로 맞춰 그 자리 유지 명령부터 보냄
    rejected_goal_tol: 0.01     # [m] = 1cm [제안]. C가 목표를 거부(오류 4·5)해 DECEL_STOP이 나면 마지막으로 반영한
                                # AI 목표를 기억하고, 새 AI 목표가 이만큼 이상 달라질 때까지 반영 안 함
                                # (rt.csv rejected_wait 열, 1초 요약 "거부된 목표 대기 중")

    # ---------------- 시작·세션 ----------------
    session_id: 0         # 0 = 첫 신선한 HalState 때 B가 발급(INIT 유지 명령부터 씀), FAULT 해제 시 새 세션.
                          # 0이 아니면 C에 등록된 그 번호 사용, FAULT 해제 시 세션·순번 유지 (fr3_integration.yaml은 42)
    require_registered_state: true  # session_id가 0이 아닐 때만: C가 그 세션의 신선한 READY/ACTIVE를 보고해야 시작
    measured_orientation: true      # HalState에서 시작하면 그때 측정한 TCP 자세를 고정 자세로 씀 (tool_orientation 대신)
    start_fallback_on_timeout: false  # true면 start_timeout_s 안에 시작 못 할 때 start_position에서 시작 (예전 기본).
                                      # false면 INIT에서 계속 기다림 (측정 안 된 임의 위치로 시작 안 함)
    # start_position: [0.5, 0.0, 0.71]  # fallback 시작 위치 (map [m]). start_fallback_on_timeout true일 때만 씀.
    #                                   # 적지 않으면 planned_position과 같음 (launch에서 planned_position을 바꾸면 같이 바뀜)
    start_timeout_s: 2.0  # fallback까지 pose_valid HalState를 기다리는 시간 [s]. [제안]
    # 시작 준비(warmup): 아래 조건이 다 맞을 때까지 INIT에 머묾 (INIT에서는 STATE_TIMEOUT 등 safety 판단 안 함)
    # + /hal/final_command 구독자 1개 이상. B 시작 직후 STATE_TIMEOUT으로 DECEL_STOP이 한 번 나던 것을 막음
    warmup_states: 5        # 새 HalState를 이만큼 받아야 함 (0 = 조건 끔) [제안]
    warmup_stable_ms: 100.0 # 발행 스레드가 이만큼 overrun 없이 깨어나야 함 [ms] [제안]
    warmup_max_s: 3.0       # 이보다 오래 준비가 안 되면 경고 (시작은 계속 기다림) [s] [제안]
    warmup_hold_ms: 100.0   # INIT 중 측정 TCP "유지 명령"을 이만큼 끊김·overrun 없이 발행해야 RUN [ms] [제안]. 0 = 조건 끔
                            # 신선한 HalState를 받으면 그 위치·자세를 1ms마다 발행 (AI 목표는 안 씀). 첫 publish()가
                            # DDS 안에서 수백 ms 막히는 비용을 RUN 전에 치름 (2026-10-08 측정 230ms)

    # ---------------- safety ----------------
    range_reject_n: 5     # 새 명령이 RANGE로 연속 이만큼 막히면 HOLD [제안]
    resume_k: 3           # HOLD에서 새 명령이 연속 이만큼 통과하면 RUN [제안] (15Hz면 약 0.2초)
    ai_decel_after_s: 0.0 # HOLD가 이보다 오래 가면 DECEL_STOP [s]. 0 = 끔 [팀 결정: 기본 끔]
    require_c_state: true # false면 C 관련 규칙을 모두 끔 (C 없이 개발할 때만)
    c_state_timeout_ms: 20.0  # C 상태 나이가 이보다 크면 DECEL_STOP [ms]. [제안] 가짜 C 250Hz(4ms 주기)의 5배
    c_expired_n: 10       # C의 E_EXPIRED가 최근 1초에 이만큼 이상이면 HOLD [제안] (1~64)
    resume_delay_s: 1.0   # DECEL_STOP 원인이 풀린 뒤 이만큼 지나고 멈춰 있으면 RUN [s]. [제안]

    # ---------------- bridge (B -> C) ----------------
    hal_ttl_ns: 5000000   # HalCommand 유효기한 [ns] = 5ms. [제안] C의 계산·전송 예산을 보고 조정
    tool_orientation: [1.0, 0.0, 0.0, 0.0]  # 고정 TCP 자세 쿼터니언 (x, y, z, w). 초기 시연은 자세 고정 [확정]

    # ---------------- 기록 (계약 v0.3 인터페이스 5-2) ----------------
    trace_enable: true    # rt.csv(매 주기 기록) 쓰기. 켜도 최대 지터 영향 없음 (2026-10-06 측정 35~47us)
    log_root: "~/pac_logs"  # 실행 기록 폴더. ~/pac_logs/<run_id>/ 에 rt.csv, ai_rx.csv, meta.yaml
    run_id: ""            # 비우면 시각(+run_tag)으로 새 폴더. 값이 있으면 ~/pac_logs/<run_id>/ 를 그대로 씀
                          # (폴더가 있어도 됨, rt.csv가 이미 있으면 오류로 멈춤). launch 인자 run_id로 바꿈
    run_tag: ""           # run_id가 비었을 때 시각 뒤에 붙는 이름 (예: stop -> 20261006_143000_stop). launch 인자 run_tag로 바꿈
